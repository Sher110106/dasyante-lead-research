[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dasyante-lead-research"
version = "0.1.0"
description = "Evidence-backed Dasyante lead research prototype"
requires-python = ">=3.12"

[project.scripts]
dasyante = "dasyante.cli:main"

[tool.setuptools.packages.find]
include = ["dasyante*"]
